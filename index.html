<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <h1 class="main-heading">Welcome to Rock Paper Scissors</h1>

    <div class="container">
      <div class="instructions">
        <p>five rounds</p>
        <p>Choices are rock, paper, & scissors</p>
      </div>

      <div class="user-input">
        <button class="btn1" onclick="playGround()" name="rock">Rock</button>
        <button class="btn2" onclick="playGround()" name="paper">Paper</button>
        <button class="btn3" onclick="playGround()" name="scissors">Scissors</button>
      </div>

      <div class="score-panel">
          <p id="user"></p>
          <p id="system"></p>
      </div>
      <span id="result"></span>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
